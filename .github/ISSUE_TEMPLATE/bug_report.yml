name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or prompts. Remove anything private from lesson text.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`python3 --version`, `claude --version`, stickit-notes version, OS"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from <store>/.state/stickit.log
      render: text
