[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stickit-notes"
version = "0.1.0"
description = "Portable lessons-learned notes for Claude Code: harvest, inject, share."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "whyzgeek" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["claude-code", "plugin", "lessons-learned", "memory", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/whyzgeek/stickit-notes"
Issues = "https://github.com/whyzgeek/stickit-notes/issues"
Changelog = "https://github.com/whyzgeek/stickit-notes/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
stickit = "stickit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stickit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["stickit"]
branch = true
# Exercised through subprocess in tests/test_hooks.py (not traced).
omit = ["*/stickit/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "N", "C4", "RET", "PL"]
ignore = [
    "PLR0911", # many returns are clearer than nested ifs in CLI handlers
    "PLR0913", # explicit keyword arguments over config objects
    "PLR2004", # magic values are fine in tests and limits are named in code
    "S603",    # subprocess with a list argv is the intended, safe use
    "S607",    # git is resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "PLR0915"]
# Must run on old interpreters to print a version hint, so no pathlib idioms.
"bin/stickit" = ["PTH", "INP001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/stickit"]
